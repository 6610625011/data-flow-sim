# Mosquitto on the (simulated) Raspberry Pi - section 2.7.1 / 2.7.2
#
# Two listeners, each with its own security settings:
#   1883  for devices on the network (ESP32 boards, the Wokwi bridge, MQTT Explorer)
#         -> username/password required (file built from .env by start.sh)
#   1884  only reachable inside the docker network (Node-RED, same "Pi")
#         -> not published to the host, so it may stay anonymous
per_listener_settings true

listener 1883
allow_anonymous false
password_file /mosquitto/passwd

listener 1884
allow_anonymous true

# keep retained status messages and queued QoS 1 messages across restarts
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Node-RED keeps a persistent session (clean session = false), so while it restarts or
# re-deploys the broker queues its QoS 1 messages: 20000 = ~2.7 h of both boards at 1 s
max_queued_messages 20000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Extra config files: every *.conf in mosquitto/bridge/ is loaded (e.g. the Wokwi bridge;
# rename bridge-wokwi.conf.example to bridge-wokwi.conf to enable it)
include_dir /mosquitto/bridge
